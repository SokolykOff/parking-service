[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
  .eggs
  | .git
  | .venv
  | .pytest_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["name-defined", "attr-defined"]